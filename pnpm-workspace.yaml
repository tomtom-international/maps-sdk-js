packages:
  - examples/**
  - testing/core-utils
  - documentation/public-repo-docs-archive

# Dependency overrides (moved from the package.json `pnpm.overrides` field, which
# pnpm 11 no longer reads — non-auth config now lives in pnpm-workspace.yaml).
overrides:
  # TODO(LSI-1157): drop the `@opentelemetry/*`, `hono`, `langsmith`, `qs` and `uuid` pins
  # below once `@langwatch/scenario` (agent tool-calling tests) ships the fixed ranges
  # itself — they lift Dependabot-flagged transitive versions it holds back.
  "@opentelemetry/core": ^2.12.0
  "@opentelemetry/exporter-prometheus": ^0.223.0
  "@opentelemetry/propagator-jaeger": ^2.12.0
  "@opentelemetry/sdk-node": ^0.223.0
  ajv: ^8.20.0
  # `@nx/key` (under `@nx/azure-cache`) pins a vulnerable axios exactly; the `uuid` pin
  # also lifts the `uuid@8` that `@azure/msal-node` holds under the same package.
  axios: ^1.20.0
  "brace-expansion@2": ^2.1.7
  "brace-expansion@5": ^5.0.12
  fsevents: ^2.3.3
  hono: ^4.13.13
  immutable: ^5.1.9
  "js-yaml@4": ^4.3.2
  langsmith: ^0.6.2
  "minimatch@10": ^10.2.6
  nanoid: ^5.1.11
  qs: ^6.16.0
  sax: ^1.6.1
  "semver@7": ^7.8.5
  smol-toml: ^1.9.0
  typescript: "catalog:"
  "undici@7": ^7.29.1
  "uuid@<11.1.1": ^11.1.1

# `image-size@0.5` reaches the tree only as an optional dependency of `less`, itself
# an optional Vite peer `autoInstallPeers` pulls in although no workspace compiles
# `.less`. Its parser DoS advisories have no fix in that line, hence the skip.
ignoredOptionalDependencies:
  - image-size

# Dependency build scripts (replaces the removed `pnpm.onlyBuiltDependencies`).
# In pnpm 11 packages not listed here are NOT built, and `strictDepBuilds`
# (now default true) fails the install if a dep has an unapproved build script.
# `sharp` (image processing, actively used) is the only build we run — it was
# also the only one approved under pnpm 10. The rest are `false` to preserve
# that behavior: none were built before and the repo builds, tests, and runs
# fine without them.
allowBuilds:
  "@parcel/watcher": false
  es5-ext: false
  esbuild: false
  ffmpeg-static: false
  nx: false
  protobufjs: false
  sharp: true

# Keep pnpm 11's 1-day quarantine on newly published packages (supply-chain
# protection: a compromised release must survive ~24h before we'll install it).
# Exempt only our own freshly-published aliases, which CI publishes and then
# installs within minutes (feature-branch / release flows).
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@tomtom-org/*"

catalog:
  "@tomtom-org/maps-sdk": 1.0.0-rc.6
  "@tomtom-org/maps-sdk-plugin-agent-toolkit": 0.18.0
  "@tomtom-org/maps-sdk-plugin-flyover": 0.1.2
  "@tomtom-org/maps-sdk-plugin-landmarks-3d": 0.3.1
  "@tomtom-org/maps-sdk-plugin-map-effects": 0.4.2
  "@tomtom-org/maps-sdk-plugin-map-theme": 0.3.9
  "@tomtom-org/maps-sdk-plugin-route-dragging": 0.0.3
  "@tomtom-org/maps-sdk-plugin-viewport-places": 0.5.10
  "@ai-sdk/azure": ^4.0.104
  "@ai-sdk/react": ^4.0.147
  "@assistant-ui/react": ^0.15.29
  "@assistant-ui/react-ai-sdk": ^1.4.18
  "@microsoft/applicationinsights-web": ^3.4.5
  # Pinned exact: 1.61 changed Playwright's module loader to pull externalized
  # ESM (map/dist/map.es.js) through Node's native require(esm), which bypasses
  # the CommonJS `Module._load` alias patch in map-integration-tests/
  # nodejs-test-code-setup.ts — so `@tomtom-org/maps-sdk/core` no longer resolves
  # and the SDK e2e suite collects 0 tests. Bump only with a matching harness fix.
  "@playwright/test": 1.60.0
  "@tailwindcss/node": ^4.3.3
  "@tailwindcss/oxide": ^4.3.3
  "@tailwindcss/vite": ^4.3.3
  "@tsconfig/recommended": ^1.0.13
  "@turf/turf": ^7.4.0
  "@types/geojson": ^7946.0.16
  "@types/culori": ^4.0.1
  "@types/lodash-es": ^4.17.12
  "@types/node": ^26.6.5
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@types/three": ^0.186.0
  "@vitejs/plugin-react": ^6.1.2
  "@vitest/coverage-v8": ^5.0.5
  ai: ^7.0.143
  assistant-stream: ^0.3.52
  "chart.js": ^4.5.1
  "chartjs-plugin-zoom": ^2.2.0
  "h3-js": ^4.5.0
  jsdom: ^30.1.3
  culori: ^4.0.2
  jszip: ^3.10.2
  lodash-es: ^4.18.1
  maplibre-gl: ^6.15.0
  marked: ^18.1.1
  react: ^19.3.1
  "react-chartjs-2": ^5.3.1
  react-dom: ^19.3.1
  rimraf: ^6.1.3
  # rolldown (vite 8's bundler) + its native dts plugin generate the SDK's bundled
  # .d.ts via the `tsc` generator, replacing the vite-plugin-dts + API Extractor stack.
  rolldown: ^1.2.14
  rolldown-plugin-dts: ^0.28.8
  rollup-plugin-analyzer: ^4.0.0
  rollup-plugin-license: ^3.7.1
  rollup-plugin-visualizer: ^7.1.1
  tailwindcss: ^4.3.3
  three: ^0.186.1
  # Held on 6: TypeScript 7 drops the compiler API that rolldown-plugin-dts's `tsc` generator and typedoc load.
  typescript: ^6.0.3
  vite: ^8.3.4
  vite-plugin-singlefile: ^2.3.4
  vitest: ^5.0.5
  yaml: ^2.9.1
  zod: ^4.6.7
