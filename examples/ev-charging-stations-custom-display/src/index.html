<!doctype html>
<html lang="en">
    <head>
        <title>EV Charging Stations Custom Display</title>
        <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
        <link rel="icon" href="data:,">
    </head>
    <body class="ui-body">
        <div id="sdk-map"></div>

        <!-- Search Panel -->
        <div class="ui-searchPanel">
            <input id="ui-evBrandTextBox" class="ui-input" type="text" placeholder="EV brand (Shell, BP, ...)">
            <button id="ui-searchButton" class="ui-button">Search</button>
            <button id="ui-clearButton" class="ui-button ui-button-secondary">Clear</button>
        </div>

        <!-- Customization Panel -->
        <div class="ui-customPanel">
            <div class="ui-panel-header">
                <h3 class="ui-heading">
                    <span class="ui-heading-text">EV Display Customization</span>
                    <button class="ui-heading-toggle" aria-label="Toggle panel" aria-expanded="true">
                        <svg class="ui-heading-chevron" viewBox="0 0 16 10">
                            <path d="M3 1.5L8 6.5L13 1.5" />
                        </svg>
                    </button>
                </h3>
            </div>

            <div class="ui-panel-content">
                <!-- Map Style Selector -->
                <div class="ui-section">
                    <label class="ui-form-label" for="ui-mapStyles">Map Style:</label>
                    <select id="ui-mapStyles" class="ui-dropdown"></select>
                </div>

                <!-- Background Stations Section -->
                <div class="ui-section">
                    <h4 class="ui-subheading">Background Stations</h4>
                    <label class="ui-checkbox-label">
                        <input type="checkbox" id="ui-bgAvailabilityToggle">
                        Show Availability
                    </label>
                    <label class="ui-checkbox-label">
                        <input type="checkbox" id="ui-bgCustomIconToggle">
                        Use Custom Icon
                    </label>
                </div>

                <!-- Searched Stations Section -->
                <div class="ui-section">
                    <h4 class="ui-subheading">Searched Stations</h4>
                    <label class="ui-checkbox-label">
                        <input type="checkbox" id="ui-searchAvailabilityToggle" checked>
                        Show Availability
                    </label>
                    <label class="ui-checkbox-label">
                        <input type="checkbox" id="ui-searchCustomIconToggle" checked>
                        Use Custom Icon
                    </label>
                </div>

                <!-- Availability Display Section -->
                <div class="ui-section">
                    <h4 class="ui-subheading">Availability Display</h4>

                    <div class="ui-form-field">
                        <label class="ui-form-label" for="ui-availabilityFormat">Format:</label>
                        <select id="ui-availabilityFormat" class="ui-dropdown">
                            <option value="slash" selected>3/10</option>
                            <option value="of">3 of 10</option>
                            <option value="available">3 available</option>
                        </select>
                    </div>

                    <div class="ui-form-field">
                        <label class="ui-form-label" for="ui-threshold">Availability Threshold (&gt;=):</label>
                        <div class="ui-slider-container">
                            <input type="range" id="ui-threshold" min="0" max="100" value="0" class="ui-slider">
                            <span id="ui-thresholdValue" class="ui-slider-value">0%</span>
                        </div>
                    </div>

                    <div class="ui-color-preview">
                        <div class="ui-color-box">
                            <div
                                class="ui-color-indicator"
                                style="background: #00A65E; width: 20px; height: 20px; border-radius: 0;"
                            ></div>
                            <span>Available (green)</span>
                        </div>
                        <div class="ui-color-box">
                            <div
                                class="ui-color-indicator"
                                style="background: #df1b12; width: 20px; height: 20px; border-radius: 0;"
                            ></div>
                            <span>Occupied (red)</span>
                        </div>
                    </div>
                </div>

                <!-- Text Style Section -->
                <div class="ui-section">
                    <h4 class="ui-subheading">Text Style</h4>

                    <div class="ui-form-field">
                        <label class="ui-form-label" for="ui-textColorPicker">Text Color:</label>
                        <span class="ui-color-swatch">
                            <input type="color" id="ui-textColorPicker" value="#FFFFFF">
                        </span>
                    </div>

                    <div class="ui-form-field">
                        <label class="ui-form-label" for="ui-haloColorPicker">Halo Color:</label>
                        <span class="ui-color-swatch">
                            <input type="color" id="ui-haloColorPicker" value="#000000">
                        </span>
                    </div>

                    <div class="ui-form-field">
                        <label class="ui-form-label" for="ui-haloWidth">Halo Width:</label>
                        <div class="ui-slider-container">
                            <input
                                type="range"
                                id="ui-haloWidth"
                                min="0"
                                max="5"
                                value="1"
                                step="0.5"
                                class="ui-slider"
                            >
                            <span id="ui-haloWidthValue" class="ui-slider-value">1px</span>
                        </div>
                    </div>

                    <div class="ui-form-field">
                        <label class="ui-form-label" for="ui-textOffset">Text Offset:</label>
                        <div class="ui-slider-container">
                            <input
                                type="range"
                                id="ui-textOffset"
                                min="0"
                                max="6"
                                value="0"
                                step="0.1"
                                class="ui-slider"
                            >
                            <span id="ui-textOffsetValue" class="ui-slider-value">0 em</span>
                        </div>
                    </div>

                    <label class="ui-checkbox-label">
                        <input type="checkbox" id="ui-useCustomOffset">
                        Override Auto Offset
                    </label>
                </div>
            </div>
        </div>
        <script type="module" src="./index.ts"></script>
    </body>
</html>
