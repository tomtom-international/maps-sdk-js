<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Traffic Flow Playground</title>
        <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
        <link rel="icon" href="data:,">
    </head>
    <body class="sdk-example-body">
        <div id="sdk-map"></div>
        <div class="sdk-example-customPanel">
            <div class="sdk-example-panel-header">
                <h3 class="sdk-example-heading">
                    <span class="sdk-example-heading-text">Traffic Flow</span>
                    <button class="sdk-example-heading-toggle" aria-label="Toggle panel" aria-expanded="true">
                        <svg class="sdk-example-heading-chevron" viewBox="0 0 16 10">
                            <path d="M3 1.5L8 6.5L13 1.5" />
                        </svg>
                    </button>
                </h3>
            </div>

            <div class="sdk-example-panel-content">
                <div class="sdk-example-section">
                    <h4 class="sdk-example-subheading">Road Category Filter</h4>
                    <label class="sdk-example-toggle-label">
                        <input
                            type="checkbox"
                            class="sdk-example-toggle-input"
                            name="roadCategory"
                            value="motorway"
                            checked
                        >
                        <span class="sdk-example-toggle-switch"></span>
                        Motorway
                    </label>
                    <label class="sdk-example-toggle-label">
                        <input
                            type="checkbox"
                            class="sdk-example-toggle-input"
                            name="roadCategory"
                            value="motorway_link"
                            checked
                        >
                        <span class="sdk-example-toggle-switch"></span>
                        Motorway Link
                    </label>
                    <label class="sdk-example-toggle-label">
                        <input
                            type="checkbox"
                            class="sdk-example-toggle-input"
                            name="roadCategory"
                            value="trunk"
                            checked
                        >
                        <span class="sdk-example-toggle-switch"></span>
                        Trunk
                    </label>
                    <label class="sdk-example-toggle-label">
                        <input
                            type="checkbox"
                            class="sdk-example-toggle-input"
                            name="roadCategory"
                            value="trunk_link"
                            checked
                        >
                        <span class="sdk-example-toggle-switch"></span>
                        Trunk Link
                    </label>
                    <label class="sdk-example-toggle-label">
                        <input
                            type="checkbox"
                            class="sdk-example-toggle-input"
                            name="roadCategory"
                            value="primary"
                            checked
                        >
                        <span class="sdk-example-toggle-switch"></span>
                        Primary
                    </label>
                    <label class="sdk-example-toggle-label">
                        <input
                            type="checkbox"
                            class="sdk-example-toggle-input"
                            name="roadCategory"
                            value="primary_link"
                            checked
                        >
                        <span class="sdk-example-toggle-switch"></span>
                        Primary Link
                    </label>
                    <label class="sdk-example-toggle-label">
                        <input
                            type="checkbox"
                            class="sdk-example-toggle-input"
                            name="roadCategory"
                            value="secondary"
                            checked
                        >
                        <span class="sdk-example-toggle-switch"></span>
                        Secondary
                    </label>
                    <label class="sdk-example-toggle-label">
                        <input
                            type="checkbox"
                            class="sdk-example-toggle-input"
                            name="roadCategory"
                            value="secondary_link"
                            checked
                        >
                        <span class="sdk-example-toggle-switch"></span>
                        Secondary Link
                    </label>
                    <label class="sdk-example-toggle-label">
                        <input
                            type="checkbox"
                            class="sdk-example-toggle-input"
                            name="roadCategory"
                            value="tertiary"
                            checked
                        >
                        <span class="sdk-example-toggle-switch"></span>
                        Tertiary
                    </label>
                    <label class="sdk-example-toggle-label">
                        <input
                            type="checkbox"
                            class="sdk-example-toggle-input"
                            name="roadCategory"
                            value="tertiary_link"
                            checked
                        >
                        <span class="sdk-example-toggle-switch"></span>
                        Tertiary Link
                    </label>
                    <label class="sdk-example-toggle-label">
                        <input
                            type="checkbox"
                            class="sdk-example-toggle-input"
                            name="roadCategory"
                            value="street"
                            checked
                        >
                        <span class="sdk-example-toggle-switch"></span>
                        Street
                    </label>
                    <label class="sdk-example-toggle-label">
                        <input
                            type="checkbox"
                            class="sdk-example-toggle-input"
                            name="roadCategory"
                            value="service"
                            checked
                        >
                        <span class="sdk-example-toggle-switch"></span>
                        Service
                    </label>
                    <label class="sdk-example-toggle-label">
                        <input
                            type="checkbox"
                            class="sdk-example-toggle-input"
                            name="roadCategory"
                            value="track"
                            checked
                        >
                        <span class="sdk-example-toggle-switch"></span>
                        Track
                    </label>
                </div>

                <div class="sdk-example-section">
                    <button class="sdk-example-button sdk-example-button-full" id="sdk-example-clearFilter">
                        Show All
                    </button>
                </div>
            </div>
        </div>
        <script type="module" src="./index.ts"></script>
    </body>
</html>
