<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Route Style Playground</title>
        <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
        <link rel="icon" href="data:,">
    </head>
    <body class="sdk-example-body">
        <div id="sdk-map"></div>

        <div class="sdk-example-customPanel">
            <div class="sdk-example-panel-header">
                <h3 class="sdk-example-heading">
                    <span class="sdk-example-heading-text">Route Style Playground</span>
                    <button class="sdk-example-heading-toggle" aria-label="Toggle panel" aria-expanded="true">
                        <svg class="sdk-example-heading-chevron" viewBox="0 0 16 10">
                            <path d="M3 1.5L8 6.5L13 1.5" />
                        </svg>
                    </button>
                </h3>
            </div>

            <div class="sdk-example-panel-content">
                <div class="sdk-example-section">
                    <div class="sdk-example-form-field">
                        <label class="sdk-example-form-label" for="routeColor-picker">Main color</label>
                        <span class="sdk-example-color-swatch">
                            <input type="color" id="routeColor-picker" value="#36A8F0">
                        </span>
                    </div>

                    <div class="sdk-example-form-field">
                        <span class="sdk-example-form-label">Route opacity</span>
                        <div class="sdk-example-slider-container">
                            <input
                                type="range"
                                id="route-opacity"
                                min="0"
                                max="100"
                                value="100"
                                step="5"
                                class="sdk-example-slider"
                            >
                            <span id="route-opacity-value" class="sdk-example-slider-value">100%</span>
                        </div>
                    </div>

                    <div class="sdk-example-form-field">
                        <span class="sdk-example-form-label">Route width</span>
                        <div class="sdk-example-radio-group sdk-example-radio-group-horizontal">
                            <label class="sdk-example-radio-label"
                                ><input type="radio" name="routeWidth" value="s">
                                S</label
                            >
                            <label class="sdk-example-radio-label"
                                ><input type="radio" name="routeWidth" value="m" checked>
                                M</label
                            >
                            <label class="sdk-example-radio-label"
                                ><input type="radio" name="routeWidth" value="l">
                                L</label
                            >
                        </div>
                    </div>

                    <div class="sdk-example-form-field">
                        <span class="sdk-example-form-label">Waypoint size</span>
                        <div class="sdk-example-radio-group sdk-example-radio-group-horizontal">
                            <label class="sdk-example-radio-label"
                                ><input type="radio" name="waypointSize" value="s">
                                S</label
                            >
                            <label class="sdk-example-radio-label"
                                ><input type="radio" name="waypointSize" value="m" checked>
                                M</label
                            >
                            <label class="sdk-example-radio-label"
                                ><input type="radio" name="waypointSize" value="l">
                                L</label
                            >
                        </div>
                    </div>

                    <div class="sdk-example-form-field">
                        <label class="sdk-example-form-label" for="toggle-center-dash">Centered dash-line</label>
                        <label class="sdk-example-toggle-label">
                            <input type="checkbox" class="sdk-example-toggle-input" id="toggle-center-dash">
                            <span class="sdk-example-toggle-switch"></span>
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <script type="module" src="./index.ts"></script>
    </body>
</html>
