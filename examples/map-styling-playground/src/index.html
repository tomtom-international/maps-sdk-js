<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Map Styling Playground</title>
        <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
        <link rel="icon" href="data:,">
    </head>
    <body class="ui-body">
        <div id="sdk-map"></div>
        <div class="ui-customPanel">
            <div class="ui-panel-header">
                <h3 class="ui-heading">
                    <span class="ui-heading-text">Map styling</span>
                    <button class="ui-heading-toggle" aria-label="Toggle panel" aria-expanded="true">
                        <svg class="ui-heading-chevron" viewBox="0 0 16 10">
                            <path d="M3 1.5L8 6.5L13 1.5" />
                        </svg>
                    </button>
                </h3>
            </div>
            <div class="ui-panel-content">
                <div class="ui-section">
                    <label class="ui-form-label" for="ui-mapStyles">Map style:</label>
                    <select class="ui-dropdown" id="ui-mapStyles"></select>
                </div>
                <div class="ui-section">
                    <label class="ui-form-label" for="ui-presets">Preset:</label>
                    <select class="ui-dropdown" id="ui-presets">
                        <option value="">—</option>
                    </select>
                </div>
                <!-- Shown first in the generated Labels section: the map's typeface, and the route's, places' and
                     district's own, which follow the map's until set -->
                <div id="ui-typeface">
                    <label class="ui-form-label" for="ui-mapTypeface">Typeface:</label>
                    <select class="ui-dropdown" id="ui-mapTypeface"></select>
                    <label class="ui-form-label" for="ui-waypointTypeface">Waypoint typeface:</label>
                    <select class="ui-dropdown" id="ui-waypointTypeface"></select>
                    <label class="ui-form-label" for="ui-placeTypeface">Museum typeface:</label>
                    <select class="ui-dropdown" id="ui-placeTypeface"></select>
                    <label class="ui-form-label" for="ui-areaTypeface">District typeface:</label>
                    <select class="ui-dropdown" id="ui-areaTypeface"></select>
                </div>
                <!-- One section per knob group, generated from stylingFoundationsKnobCatalogue -->
                <div id="ui-knobs"></div>
                <!-- A raw layer edit through styling.layers.query, below the knobs it lands on top of -->
                <div id="ui-layerEdits">
                    <label
                        class="ui-toggle-label"
                        title="styling.layers.query({ group: 'roadLabels' }).setPaint(…): kept across style switches, not by the reset button"
                    >
                        <input type="checkbox" class="ui-toggle-input" id="ui-roadLabelsEdit">
                        <span class="ui-toggle-switch"></span>Road labels in magenta
                    </label>
                    <label
                        class="ui-toggle-label"
                        title="styling.layers.query({ group: 'trafficFlow', layerTypes: ['line'] }).setPaint(…): a style-owned module's layers, by group"
                    >
                        <input type="checkbox" class="ui-toggle-input" id="ui-trafficFlowEdit">
                        <span class="ui-toggle-switch"></span>Traffic flow blurred
                    </label>
                </div>
                <!-- One toggle per base-map layer group, generated from baseMapKnobCatalogue -->
                <div id="ui-baseMapGroups"></div>
                <div class="ui-section">
                    <button class="ui-button" id="ui-reset" type="button">Reset to style defaults</button>
                </div>
            </div>
        </div>
        <script type="module" src="./index.ts"></script>
    </body>
</html>
