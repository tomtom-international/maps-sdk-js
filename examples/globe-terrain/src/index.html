<!doctype html>
<html lang="en">
    <head>
        <title>Globe and 3D terrain</title>
        <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
        <link rel="icon" href="data:,">
    </head>
    <body class="ui-body">
        <div id="sdk-map"></div>
        <div class="ui-customPanel">
            <div class="ui-panel-header">
                <h3 class="ui-heading">
                    <span class="ui-heading-text">View</span>
                    <button class="ui-heading-toggle" aria-label="Toggle panel" aria-expanded="true">
                        <svg class="ui-heading-chevron" viewBox="0 0 16 10">
                            <path d="M3 1.5L8 6.5L13 1.5" />
                        </svg>
                    </button>
                </h3>
            </div>
            <div class="ui-panel-content">
                <div class="ui-section">
                    <label class="ui-toggle-label">
                        <input type="checkbox" class="ui-toggle-input" id="ui-globe" checked>
                        <span class="ui-toggle-switch"></span>
                        Globe projection
                    </label>
                    <label class="ui-toggle-label">
                        <input type="checkbox" class="ui-toggle-input" id="ui-sky" checked>
                        <span class="ui-toggle-switch"></span>
                        Sky and atmosphere
                    </label>
                    <label class="ui-toggle-label">
                        <input type="checkbox" class="ui-toggle-input" id="ui-terrain">
                        <span class="ui-toggle-switch"></span>
                        3D terrain
                    </label>
                </div>
                <div class="ui-section">
                    <label class="ui-form-label" for="ui-exaggeration">Terrain exaggeration</label>
                    <div class="ui-slider-container">
                        <input
                            type="range"
                            class="ui-slider"
                            id="ui-exaggeration"
                            min="0.5"
                            max="3"
                            step="0.1"
                            value="1.2"
                        >
                        <span class="ui-slider-value" id="ui-exaggerationValue">1.2</span>
                    </div>
                </div>
                <div class="ui-section">
                    <button class="ui-button" id="ui-flyToAlps" type="button">Fly to the Alps</button>
                </div>
            </div>
        </div>
        <script type="module" src="./index.ts"></script>
    </body>
</html>
