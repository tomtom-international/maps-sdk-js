<!doctype html>
<html lang="en">
    <head>
        <title>3D Landmarks</title>
        <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
        <link rel="icon" href="data:,">
    </head>
    <body class="ui-body">
        <div id="sdk-map"></div>

        <div class="ui-customPanel">
            <div class="ui-panel-header">
                <h3 class="ui-heading">
                    <span class="ui-heading-text">3D Landmarks</span>
                    <button class="ui-heading-toggle" aria-label="Toggle panel" aria-expanded="true">
                        <svg class="ui-heading-chevron" viewBox="0 0 16 10">
                            <path d="M3 1.5L8 6.5L13 1.5" />
                        </svg>
                    </button>
                </h3>
            </div>

            <div class="ui-panel-content">
                <div class="ui-section">
                    <label class="ui-form-field">
                        <span class="ui-form-label">Landmark</span>
                        <select class="ui-dropdown" id="ui-place"></select>
                    </label>
                    <label class="ui-form-field">
                        <span class="ui-form-label">Map style</span>
                        <select class="ui-dropdown" id="ui-basemap"></select>
                    </label>
                </div>

                <div class="ui-section">
                    <label class="ui-form-field">
                        <span class="ui-form-label">Built-up colour</span>
                        <span class="ui-color-swatch"><input type="color" id="ui-builtUp"></span>
                    </label>
                    <button class="ui-button" id="ui-builtUp-reset">Style's built-up colour</button>
                    <label class="ui-toggle-label">
                        <input type="checkbox" class="ui-toggle-input" id="ui-buildings3D" checked>
                        <span class="ui-toggle-switch"></span>
                        Sunlit 3D buildings with shadows
                    </label>
                </div>

                <div class="ui-section" id="ui-landmarks">
                    <span class="ui-form-label">Landmarks</span>
                </div>
                <div class="ui-section">
                    <button class="ui-button" id="ui-follow">Follow the 3D buildings</button>
                </div>
            </div>
        </div>

        <script type="module" src="./index.ts"></script>
    </body>
</html>
