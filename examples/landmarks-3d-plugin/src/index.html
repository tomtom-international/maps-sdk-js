<!doctype html>
<html lang="en">
    <head>
        <title>3D Landmarks</title>
        <meta name="viewport" content="initial-scale=1">
        <link rel="icon" href="data:,">
    </head>
    <body class="ui-body">
        <div id="sdk-map"></div>

        <div class="ui-customPanel">
            <div class="ui-panel-header">
                <h3 class="ui-heading">
                    <span class="ui-heading-text">3D Landmarks</span>
                    <button class="ui-heading-toggle" aria-label="Toggle panel" aria-expanded="true">
                        <svg class="ui-heading-chevron" viewBox="0 0 16 10">
                            <path d="M3 1.5L8 6.5L13 1.5" />
                        </svg>
                    </button>
                </h3>
            </div>

            <div class="ui-panel-content">
                <div class="ui-section">
                    <div class="ui-form-field">
                        <label class="ui-form-label" for="ui-basemap">Basemap theme:</label>
                        <select class="ui-dropdown" id="ui-basemap"></select>
                    </div>

                    <div class="ui-form-field">
                        <label class="ui-form-label" for="ui-builtUp">Built-up colour:</label>
                        <span class="ui-color-swatch"><input type="color" id="ui-builtUp"></span>
                    </div>
                    <button class="ui-button" id="ui-builtUp-reset">Style's built-up colour</button>
                </div>

                <div class="ui-section">
                    <span class="ui-form-label">Landmarks</span>
                    <div class="ui-form-field">
                        <label class="ui-form-label" for="ui-color">Colour</label>
                        <span class="ui-color-swatch"><input type="color" id="ui-color"></span>
                    </div>
                    <div class="ui-form-field">
                        <label class="ui-form-label" for="ui-opacity">Opacity</label>
                        <div class="ui-slider-container">
                            <input type="range" class="ui-slider" id="ui-opacity" min="0" max="1" step="0.05">
                            <span class="ui-slider-value" id="ui-opacity-value"></span>
                        </div>
                    </div>
                    <label class="ui-toggle-label">
                        <input type="checkbox" class="ui-toggle-input" id="ui-verticalGradient">
                        <span class="ui-toggle-switch"></span>
                        Walls darken towards the ground
                    </label>
                    <button class="ui-button" id="ui-follow">Follow the 3D buildings</button>
                </div>
            </div>
        </div>

        <script type="module" src="./index.ts"></script>
    </body>
</html>
