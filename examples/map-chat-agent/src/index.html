<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Map Chat Agent</title>
        <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
        <link rel="icon" href="data:,">
    </head>
    <body>
        <div id="app">
            <div id="sdk-map"></div>
            <div id="chat-panel">
                <div id="chat-header">
                    <div>
                        <h2>Map Assistant</h2>
                        <div id="token-stats" class="token-stats">
                            <span class="stat">Input: <strong id="input-tokens">0</strong></span>
                            <span class="stat">Output: <strong id="output-tokens">0</strong></span>
                            <span class="stat">Total: <strong id="total-tokens">0</strong></span>
                        </div>
                    </div>
                    <button id="clear-chat" title="Clear conversation">Clear</button>
                </div>
                <div id="chat-messages"></div>
                <div id="chat-input-container">
                    <input
                        type="text"
                        id="chat-input"
                        placeholder="Ask me about locations, routes, or map controls..."
                        autocomplete="off"
                    >
                    <button id="send-button">Send</button>
                </div>
            </div>
        </div>
        <script type="module" src="./index.ts"></script>
    </body>
</html>
