<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Area Analytics Config Playground</title>
        <meta name="viewport" content="initial-scale=1">
        <link rel="icon" href="data:,">
    </head>
    <body class="sdk-example-body">
        <div id="sdk-map"></div>

        <!-- Map controls (top-left) -->
        <div class="aa-map-controls">
            <button class="sdk-example-button sdk-example-button-sm sdk-example-toggle active" id="toggle-3d">
                3D
            </button>
            <select class="sdk-example-dropdown aa-style-select" id="style-switcher"></select>
        </div>

        <!-- Controls panel (top-right) -->
        <div class="sdk-example-customPanel">
            <div class="sdk-example-panel-header">
                <h3 class="sdk-example-heading">
                    <span class="sdk-example-heading-text">Area Analytics Config</span>
                    <button class="sdk-example-heading-toggle" aria-label="Toggle panel" aria-expanded="true">
                        <svg class="sdk-example-heading-chevron" viewBox="0 0 16 10">
                            <path d="M3 1.5L8 6.5L13 1.5" />
                        </svg>
                    </button>
                </h3>
            </div>
            <div class="sdk-example-panel-content">
                <!-- Metric -->
                <div class="sdk-example-section">
                    <label class="sdk-example-form-label" for="metric-selector">Metric</label>
                    <select class="sdk-example-dropdown" id="metric-selector">
                        <option value="congestionLevel" selected>Congestion Level</option>
                        <option value="speed">Speed</option>
                        <option value="travelTime">Travel Time</option>
                        <option value="freeFlowSpeed">Free Flow Speed</option>
                        <option value="networkLength">Network Length (road density)</option>
                    </select>
                </div>

                <!-- Visualization Mode -->
                <div class="sdk-example-section">
                    <label class="sdk-example-form-label" for="mode-selector">Visualization</label>
                    <select class="sdk-example-dropdown" id="mode-selector">
                        <option value="hexgrid-3d" selected>3D Hex Grid</option>
                        <option value="hexgrid-2d">Flat Hex Grid</option>
                        <option value="square-3d">3D Square Grid</option>
                        <option value="square-2d">Flat Square Grid</option>
                        <option value="heatmap">Heatmap</option>
                    </select>
                </div>

                <!-- Color Theme -->
                <div class="sdk-example-section">
                    <label class="sdk-example-form-label" for="color-theme-selector">Color Theme</label>
                    <select class="sdk-example-dropdown" id="color-theme-selector">
                        <option value="trafficLight" selected>Traffic Light</option>
                        <option value="heat">Heat</option>
                        <option value="monochrome">Monochrome</option>
                        <option value="viridis">Viridis</option>
                        <option value="plasma">Plasma</option>
                        <option value="custom" disabled>Custom</option>
                    </select>
                </div>

                <!-- Color Stops -->
                <div class="sdk-example-section">
                    <span class="sdk-example-form-label">Color Stops</span>
                    <div class="aa-field-row">
                        <span class="aa-field-label">Value type</span>
                        <select class="sdk-example-dropdown aa-field-select-sm" id="value-type-selector">
                            <option value="raw">Raw</option>
                            <option value="relativeToPredefinedRangePCT">Predefined %</option>
                            <option value="relativeToActualRangePCT">Actual %</option>
                        </select>
                    </div>
                    <div id="color-stops-list" style="display: flex; flex-direction: column; gap: 6px;"></div>
                    <button
                        class="sdk-example-button sdk-example-button-sm sdk-example-button-outline sdk-example-button-full aa-add-stop"
                        id="add-stop-btn"
                        type="button"
                    >
                        + Add Stop
                    </button>
                </div>

                <!-- Height -->
                <div class="sdk-example-section">
                    <span class="sdk-example-form-label">Height</span>
                    <div class="aa-field-row">
                        <span class="aa-field-label">Max height (m)</span>
                        <input
                            type="number"
                            id="height-max-height"
                            class="sdk-example-input aa-field-input-sm"
                            placeholder="auto"
                            min="0"
                            step="10"
                        >
                    </div>
                    <div class="aa-field-row" style="display: none;">
                        <span class="aa-field-label">Scale factor</span>
                        <input
                            type="number"
                            id="height-scale-factor"
                            class="sdk-example-input aa-field-input-sm"
                            placeholder="1"
                            min="0"
                            step="0.1"
                        >
                    </div>
                    <div class="aa-field-row">
                        <span class="aa-field-label">Min height (m)</span>
                        <input
                            type="number"
                            id="height-min-height"
                            class="sdk-example-input aa-field-input-sm"
                            placeholder="0"
                            min="0"
                            step="1"
                        >
                    </div>
                    <div class="aa-field-row">
                        <span class="aa-field-label">Scale mode</span>
                        <select class="sdk-example-dropdown aa-field-select-sm" id="height-scale-mode">
                            <option value="raw">Raw</option>
                            <option value="predefinedRange" selected>Predefined range</option>
                            <option value="currentRange">Current range</option>
                        </select>
                    </div>
                </div>

                <!-- Layer order -->
                <div class="sdk-example-section">
                    <label class="sdk-example-form-label" for="before-layer-selector">Layer Order</label>
                    <select class="sdk-example-dropdown" id="before-layer-selector"></select>
                </div>
            </div>
        </div>

        <!-- Loading overlay -->
        <div id="loading-overlay" class="aa-loading aa-hidden">
            <div class="sdk-example-spinner"></div>
            <span>Loading analytics...</span>
        </div>

        <script type="module" src="./index.ts"></script>
    </body>
</html>
