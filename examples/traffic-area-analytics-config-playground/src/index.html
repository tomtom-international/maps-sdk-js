<!doctype html>
<html lang="en">
    <head>
        <title>Area Analytics Config Playground</title>
        <meta name="viewport" content="initial-scale=1">
        <link rel="icon" href="data:,">
    </head>
    <body class="ui-body">
        <div id="sdk-map"></div>

        <!-- Map controls (top-left) -->
        <div class="aa-map-controls">
            <button class="ui-button ui-button-sm ui-toggle active" id="toggle-3d">3D</button>
            <select class="ui-dropdown aa-style-select" id="style-switcher"></select>
        </div>

        <!-- Controls panel (top-right) -->
        <div class="ui-customPanel">
            <div class="ui-panel-header">
                <h3 class="ui-heading">
                    <span class="ui-heading-text">Area Analytics Config</span>
                    <button class="ui-heading-toggle" aria-label="Toggle panel" aria-expanded="true">
                        <svg class="ui-heading-chevron" viewBox="0 0 16 10">
                            <path d="M3 1.5L8 6.5L13 1.5" />
                        </svg>
                    </button>
                </h3>
            </div>
            <div class="ui-panel-content">
                <!-- Metric -->
                <div class="ui-section">
                    <label class="ui-form-label" for="metric-selector">Metric</label>
                    <select class="ui-dropdown" id="metric-selector"></select>
                </div>

                <!-- Visualization Mode -->
                <div class="ui-section">
                    <label class="ui-form-label" for="mode-selector">Visualization</label>
                    <select class="ui-dropdown" id="mode-selector"></select>
                </div>

                <!-- Palette -->
                <div class="ui-section">
                    <label class="ui-form-label" for="palette-selector">Palette</label>
                    <select class="ui-dropdown" id="palette-selector">
                        <option value="custom" disabled>Custom</option>
                    </select>
                </div>

                <!-- Color Stops -->
                <div class="ui-section">
                    <span class="ui-form-label">Color Stops</span>
                    <div class="aa-field-row">
                        <span class="aa-field-label">Scale mode</span>
                        <select class="ui-dropdown aa-field-select-sm" id="scale-mode-selector">
                            <option value="raw">Raw</option>
                            <option value="predefinedRange">Predefined %</option>
                            <option value="currentRange">Current %</option>
                        </select>
                    </div>
                    <div id="color-stops-list" style="display: flex; flex-direction: column; gap: 6px;"></div>
                    <button
                        class="ui-button ui-button-sm ui-button-outline ui-button-full aa-add-stop"
                        id="add-stop-btn"
                        type="button"
                    >
                        + Add Stop
                    </button>
                </div>

                <!-- Height -->
                <div class="ui-section">
                    <span class="ui-form-label">Height</span>
                    <div class="aa-field-row">
                        <span class="aa-field-label">Max height (m)</span>
                        <input type="number" id="height-max-height" class="ui-input aa-field-input-sm">
                    </div>
                    <div class="aa-field-row" style="display: none;">
                        <span class="aa-field-label">Metres per unit</span>
                        <input type="number" id="height-meters-per-unit" class="ui-input aa-field-input-sm">
                    </div>
                    <div class="aa-field-row">
                        <span class="aa-field-label">Min height (m)</span>
                        <input type="number" id="height-min-height" class="ui-input aa-field-input-sm">
                    </div>
                    <div class="aa-field-row">
                        <span class="aa-field-label">Scale mode</span>
                        <select class="ui-dropdown aa-field-select-sm" id="height-scale-mode"></select>
                    </div>
                </div>

                <!-- Layer order -->
                <div class="ui-section">
                    <label class="ui-form-label" for="before-layer-selector">Layer Order</label>
                    <select class="ui-dropdown" id="before-layer-selector"></select>
                </div>
            </div>
        </div>

        <!-- Loading overlay -->
        <div id="loading-overlay" class="aa-loading aa-hidden">
            <div class="ui-spinner"></div>
            <span>Loading analytics...</span>
        </div>

        <script type="module" src="./index.ts"></script>
    </body>
</html>
