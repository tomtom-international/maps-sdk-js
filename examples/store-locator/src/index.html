<!doctype html>
<html lang="en">
    <head>
        <title>Store locator</title>
        <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
        <link rel="icon" href="data:,">
    </head>
    <body class="ui-body">
        <div id="sdk-map"></div>
        <div class="ui-customPanel">
            <div class="ui-panel-header">
                <h3 class="ui-heading"><span class="ui-heading-text">Korenbloem bakeries near you</span></h3>
            </div>

            <div class="ui-panel-content">
                <div class="ui-section">
                    <form id="ui-search" class="ui-search-row">
                        <input
                            id="ui-address"
                            class="ui-input"
                            type="text"
                            value="Museumplein 6, Amsterdam"
                            aria-label="Your address"
                            placeholder="Your address"
                        >
                        <button class="ui-button" type="submit">Find</button>
                    </form>
                    <p id="ui-status" class="ui-status" role="status"></p>
                </div>

                <div class="ui-section">
                    <h4 class="ui-subheading">Nearest by drive time</h4>
                    <ol id="ui-stores" class="ui-stores"></ol>
                </div>
            </div>
        </div>
        <script type="module" src="./index.ts"></script>
    </body>
</html>
