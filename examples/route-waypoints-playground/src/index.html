<!doctype html>
<html lang="en">
    <head>
        <title>Route waypoints playground</title>
        <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
        <link rel="icon" href="data:,">
    </head>
    <body class="ui-body">
        <div id="sdk-map"></div>
        <div id="ui-panel" class="ui-customPanel">
            <div class="ui-panel-header">
                <h3 class="ui-heading">
                    <span class="ui-heading-text">Route waypoints</span>
                    <button class="ui-heading-toggle" aria-label="Toggle panel" aria-expanded="true">
                        <svg class="ui-heading-chevron" viewBox="0 0 16 10">
                            <path d="M3 1.5L8 6.5L13 1.5" />
                        </svg>
                    </button>
                </h3>
            </div>
            <div class="ui-panel-content">
                <p class="ui-hint">
                    A day out with three stops, two of them places from search. Hover a pin to see it grow.
                </p>

                <div class="ui-section">
                    <h4 class="ui-subheading">Icons</h4>
                    <label class="ui-toggle-label">
                        <input type="checkbox" class="ui-toggle-input" id="ui-categoryIcons" checked>
                        <span class="ui-toggle-switch"></span>
                        Stops at a place show its category
                    </label>
                    <label class="ui-toggle-label">
                        <input type="checkbox" class="ui-toggle-input" id="ui-finishFlag">
                        <span class="ui-toggle-switch"></span>
                        A flag of your own at the finish
                    </label>
                    <p class="ui-hint ui-readout" id="ui-hovered">No pin hovered yet</p>
                </div>

                <div class="ui-section">
                    <h4 class="ui-subheading">Knobs</h4>
                    <div id="ui-knobs"></div>
                </div>
            </div>
        </div>
        <script type="module" src="./index.ts"></script>
    </body>
</html>
