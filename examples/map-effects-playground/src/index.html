<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Map Effects Playground</title>
        <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
        <link rel="icon" href="data:,">
    </head>
    <body class="ui-body">
        <div id="sdk-map"></div>
        <div class="ui-customPanel">
            <div class="ui-panel-header">
                <h3 class="ui-heading">
                    <span class="ui-heading-text">Map effects</span>
                    <button class="ui-heading-toggle" aria-label="Toggle panel" aria-expanded="true">
                        <svg class="ui-heading-chevron" viewBox="0 0 16 10">
                            <path d="M3 1.5L8 6.5L13 1.5" />
                        </svg>
                    </button>
                </h3>
            </div>
            <div class="ui-panel-content">
                <div class="ui-section">
                    <label class="ui-form-label" for="ui-useCase">Use case:</label>
                    <select class="ui-dropdown" id="ui-useCase">
                        <option value="">—</option>
                        <option value="data-viz">Mute the base map so data stands out</option>
                        <option value="night-driving">Night driving emphasis (bloom)</option>
                        <option value="focus">Focus on the centre</option>
                    </select>
                </div>
                <!-- One section per effect, generated from effects.describe() -->
                <div id="ui-knobs"></div>
                <div class="ui-section">
                    <button class="ui-button" id="ui-reset" type="button">All effects off</button>
                    <button class="ui-button" id="ui-capture" type="button">Capture at 2×</button>
                </div>
            </div>
        </div>
        <script type="module" src="./index.ts"></script>
    </body>
</html>
