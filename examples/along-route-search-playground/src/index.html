<!doctype html>
<html lang="en">
    <head>
        <title>Along route search playground</title>
        <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
        <link rel="icon" href="data:,">
    </head>
    <body class="ui-body">
        <div id="sdk-map"></div>
        <div class="ui-customPanel">
            <div class="ui-panel-header">
                <h3 class="ui-heading">
                    <span class="ui-heading-text">Along Route Search</span>
                    <button class="ui-heading-toggle" aria-label="Toggle panel" aria-expanded="true">
                        <svg class="ui-heading-chevron" viewBox="0 0 16 10">
                            <path d="M3 1.5L8 6.5L13 1.5" />
                        </svg>
                    </button>
                </h3>
            </div>

            <div class="ui-panel-content">
                <div class="ui-section">
                    <label class="ui-form-label" for="ui-route">Route</label>
                    <select id="ui-route" class="ui-dropdown"></select>
                </div>

                <div class="ui-section">
                    <label class="ui-form-label" for="ui-queryInput">Query</label>
                    <input id="ui-queryInput" class="ui-input" type="text" placeholder="e.g. coffee, hotel...">
                </div>

                <div class="ui-section ui-categories-section">
                    <h4 class="ui-subheading">POI Categories</h4>
                    <div id="ui-categoriesContainer" class="ui-checkbox-list ui-categories-list"></div>
                </div>

                <div class="ui-section">
                    <label class="ui-form-label" for="ui-detourSlider">Max detour time</label>
                    <div class="ui-slider-container">
                        <input id="ui-detourSlider" class="ui-slider" type="range" min="1" max="15" step="1" value="5">
                        <span id="ui-detourValue" class="ui-slider-value">5 min</span>
                    </div>
                </div>

                <div class="ui-section">
                    <label class="ui-form-label" for="ui-stretch">Search along</label>
                    <select id="ui-stretch" class="ui-dropdown">
                        <option value="whole" selected>Whole route</option>
                        <option value="sections">Section types</option>
                        <option value="share">Part of the route</option>
                    </select>
                    <div id="ui-sectionStretch" hidden>
                        <div
                            class="ui-radio-group ui-radio-group-horizontal"
                            role="radiogroup"
                            aria-label="How the ticked section types apply"
                        >
                            <label class="ui-radio-label">
                                <input type="radio" name="ui-sectionFilter" value="include" checked>
                                Only these
                            </label>
                            <label class="ui-radio-label">
                                <input type="radio" name="ui-sectionFilter" value="exclude">
                                Except these
                            </label>
                        </div>
                        <div
                            id="ui-sectionTypes"
                            class="ui-checkbox-list ui-section-types"
                            role="group"
                            aria-label="Section types"
                        ></div>
                    </div>
                    <div id="ui-shareStretch" hidden>
                        <label class="ui-form-label" for="ui-fromSlider">From</label>
                        <div class="ui-slider-container">
                            <input
                                id="ui-fromSlider"
                                class="ui-slider"
                                type="range"
                                min="0"
                                max="100"
                                step="5"
                                value="0"
                            >
                            <span id="ui-fromValue" class="ui-slider-value">0%</span>
                        </div>
                        <label class="ui-form-label" for="ui-toSlider">To</label>
                        <div class="ui-slider-container">
                            <input
                                id="ui-toSlider"
                                class="ui-slider"
                                type="range"
                                min="0"
                                max="100"
                                step="5"
                                value="100"
                            >
                            <span id="ui-toValue" class="ui-slider-value">100%</span>
                        </div>
                    </div>
                    <p id="ui-stretchNote" class="ui-note" role="status"></p>
                </div>

                <div class="ui-panel-footer">
                    <div class="ui-footer-buttons">
                        <button id="ui-searchButton" class="ui-button ui-button-full">Search</button>
                        <button id="ui-clearButton" class="ui-button ui-button-full ui-button-secondary">Clear</button>
                    </div>
                </div>
            </div>
        </div>
        <script type="module" src="./index.ts"></script>
    </body>
</html>
