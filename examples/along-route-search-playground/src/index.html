<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Along route search playground</title>
        <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
        <link rel="icon" href="data:,">
    </head>
    <body class="sdk-example-body">
        <div id="sdk-map"></div>
        <div class="sdk-example-customPanel">
            <div class="sdk-example-panel-header">
                <h3 class="sdk-example-heading">
                    <span class="sdk-example-heading-text">Along Route Search</span>
                    <button class="sdk-example-heading-toggle" aria-label="Toggle panel" aria-expanded="true">
                        <svg class="sdk-example-heading-chevron" viewBox="0 0 16 10">
                            <path d="M3 1.5L8 6.5L13 1.5" />
                        </svg>
                    </button>
                </h3>
            </div>

            <div class="sdk-example-panel-content">
                <div class="sdk-example-section">
                    <label class="sdk-example-form-label" for="sdk-example-queryInput">Query</label>
                    <input
                        id="sdk-example-queryInput"
                        class="sdk-example-input"
                        type="text"
                        placeholder="e.g. coffee, hotel..."
                    >
                </div>

                <div class="sdk-example-section sdk-example-categories-section">
                    <h4 class="sdk-example-subheading">POI Categories</h4>
                    <div
                        id="sdk-example-categoriesContainer"
                        class="sdk-example-checkbox-list sdk-example-categories-list"
                    ></div>
                </div>

                <div class="sdk-example-section">
                    <label class="sdk-example-form-label" for="sdk-example-detourSlider">Max detour time</label>
                    <div class="sdk-example-slider-container">
                        <input
                            id="sdk-example-detourSlider"
                            class="sdk-example-slider"
                            type="range"
                            min="1"
                            max="15"
                            step="1"
                            value="5"
                        >
                        <span id="sdk-example-detourValue" class="sdk-example-slider-value">5 min</span>
                    </div>
                </div>

                <div class="sdk-example-panel-footer">
                    <div class="sdk-example-footer-buttons">
                        <button id="sdk-example-searchButton" class="sdk-example-button sdk-example-button-full">
                            Search
                        </button>
                        <button
                            id="sdk-example-clearButton"
                            class="sdk-example-button sdk-example-button-full sdk-example-button-secondary"
                        >
                            Clear
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <script type="module" src="./index.ts"></script>
    </body>
</html>
