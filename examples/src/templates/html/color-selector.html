<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
        <title>Color Picker - Maps SDK JS</title>
        <link rel="stylesheet" href="../css/styles.css">
    </head>
    <body class="body">
        <!-- Simple color picker -->
        <div class="sdk-example-form-field">
            <label class="sdk-example-form-label" for="sdk-example-textColorPicker">Text Color</label>
            <span class="sdk-example-color-swatch">
                <input type="color" id="sdk-example-textColorPicker" value="#df1b12">
            </span>
        </div>

        <!-- Multiple color pickers for different properties -->
        <div class="sdk-example-section">
            <h4 class="sdk-example-subheading">Color Options</h4>

            <!-- Text Color -->
            <div class="sdk-example-form-field">
                <label class="sdk-example-form-label" for="sdk-example-textColorPicker2">Text Color</label>
                <span class="sdk-example-color-swatch">
                    <input type="color" id="sdk-example-textColorPicker2" value="#ffffff">
                </span>
            </div>

            <!-- Background Color -->
            <div class="sdk-example-form-field">
                <label class="sdk-example-form-label" for="sdk-example-bgColorPicker">Background Color</label>
                <span class="sdk-example-color-swatch">
                    <input type="color" id="sdk-example-bgColorPicker" value="#ffffff">
                </span>
            </div>
        </div>

        <!-- Color preview (shows currently selected color) -->
        <div class="sdk-example-color-preview">
            <div class="sdk-example-color-box">
                <div
                    class="sdk-example-color-indicator"
                    id="sdk-example-selectedColorIndicator"
                    style="background: #df1b12;"
                ></div>
                <span class="sdk-example-label"
                    >Selected: <span id="sdk-example-selectedColorValue">#df1b12</span></span
                >
            </div>
        </div>

        <!--
    JavaScript Event Listener Example:

    const colorPicker = document.getElementById('sdk-example-textColorPicker') as HTMLInputElement;

    colorPicker.addEventListener('input', () => {
        console.log('Selected color:', colorPicker.value);
    });
    -->
    </body>
</html>
