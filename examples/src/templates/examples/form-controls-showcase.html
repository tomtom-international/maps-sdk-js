<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
        <title>Form Controls Showcase - Maps SDK JS</title>
        <link rel="icon" href="data:,">

        <!-- Import complete SDK Example styles -->
        <link rel="stylesheet" href="../css/styles.css">

        <style>
        /* Custom styles for showcase grid layout */
        .showcase-grid {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 10px;
            max-height: calc(100vh - 20px);
            overflow-y: auto;
        }

        .showcase-card {
            background: var(--ui-surface-0);
            padding: var(--ui-panel-padding);
            border-radius: var(--ui-rounded-20);
            box-shadow: var(--ui-elevation-e2);
        }

        @media (max-width: 768px) {
            .showcase-grid {
                grid-template-columns: 1fr;
            }
        }
        </style>
    </head>
    <body class="ui-body">
        <!-- Map container (background) -->
        <div id="sdk-map" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);"></div>

        <!-- Showcase Grid -->
        <div class="showcase-grid">
            <!-- Buttons Card -->
            <div class="showcase-card">
                <h3 class="ui-heading">
                    <span class="ui-heading-text">Buttons</span>
                    <button class="ui-heading-toggle" aria-label="Toggle section" aria-expanded="true">
                        <svg class="ui-heading-chevron" viewBox="0 0 24 24" width="16" height="16">
                            <path d="M7 10l5 5 5-5" />
                        </svg>
                    </button>
                </h3>
                <div class="ui-panel-content">
                    <div class="ui-button-group-vertical">
                        <button class="ui-button">Primary Button</button>
                        <button class="ui-button ui-button-secondary">Secondary</button>
                        <button class="ui-button ui-button-tertiary">Tertiary</button>
                        <button class="ui-button ui-button-outline">Outline</button>
                        <button class="ui-button ui-button-ghost">Ghost</button>
                        <button class="ui-button" disabled>Disabled</button>
                    </div>
                </div>
            </div>

            <!-- Toggle Switches Card -->
            <div class="showcase-card">
                <h3 class="ui-heading">
                    <span class="ui-heading-text">Toggle Switches</span>
                    <button class="ui-heading-toggle" aria-label="Toggle section" aria-expanded="true">
                        <svg class="ui-heading-chevron" viewBox="0 0 24 24" width="16" height="16">
                            <path d="M7 10l5 5 5-5" />
                        </svg>
                    </button>
                </h3>
                <div class="ui-panel-content">
                    <label class="ui-toggle-label">
                        <input type="checkbox" class="ui-toggle-input" checked>
                        <span class="ui-toggle-switch"></span>
                        Toggle On
                    </label>
                    <label class="ui-toggle-label">
                        <input type="checkbox" class="ui-toggle-input">
                        <span class="ui-toggle-switch"></span>
                        Toggle Off
                    </label>
                    <label class="ui-toggle-label">
                        <input type="checkbox" class="ui-toggle-input" disabled checked>
                        <span class="ui-toggle-switch"></span>
                        Disabled (On)
                    </label>
                </div>
            </div>

            <!-- Checkboxes Card -->
            <div class="showcase-card">
                <h3 class="ui-heading">
                    <span class="ui-heading-text">Checkboxes</span>
                    <button class="ui-heading-toggle" aria-label="Toggle section" aria-expanded="true">
                        <svg class="ui-heading-chevron" viewBox="0 0 24 24" width="16" height="16">
                            <path d="M7 10l5 5 5-5" />
                        </svg>
                    </button>
                </h3>
                <div class="ui-panel-content">
                    <div class="ui-checkbox-list">
                        <label class="ui-checkbox-label">
                            <input type="checkbox" checked>
                            Checked Option
                        </label>
                        <label class="ui-checkbox-label">
                            <input type="checkbox">
                            Unchecked Option
                        </label>
                        <label class="ui-checkbox-label">
                            <input type="checkbox" disabled>
                            Disabled Option
                        </label>
                        <label class="ui-checkbox-label">
                            <input type="checkbox" disabled checked>
                            Disabled Checked
                        </label>
                    </div>
                </div>
            </div>

            <!-- Radio Buttons Card -->
            <div class="showcase-card">
                <h3 class="ui-heading">
                    <span class="ui-heading-text">Radio Buttons</span>
                    <button class="ui-heading-toggle" aria-label="Toggle section" aria-expanded="true">
                        <svg class="ui-heading-chevron" viewBox="0 0 24 24" width="16" height="16">
                            <path d="M7 10l5 5 5-5" />
                        </svg>
                    </button>
                </h3>
                <div class="ui-panel-content">
                    <div class="ui-radio-group">
                        <label class="ui-radio-label">
                            <input type="radio" name="showcase" value="1" checked>
                            Selected Option
                        </label>
                        <label class="ui-radio-label">
                            <input type="radio" name="showcase" value="2">
                            Unselected Option
                        </label>
                        <label class="ui-radio-label">
                            <input type="radio" name="showcase" value="3" disabled>
                            Disabled Option
                        </label>
                    </div>
                </div>
            </div>

            <!-- Text Inputs Card -->
            <div class="showcase-card">
                <h3 class="ui-heading">
                    <span class="ui-heading-text">Text Inputs</span>
                    <button class="ui-heading-toggle" aria-label="Toggle section" aria-expanded="true">
                        <svg class="ui-heading-chevron" viewBox="0 0 24 24" width="16" height="16">
                            <path d="M7 10l5 5 5-5" />
                        </svg>
                    </button>
                </h3>
                <div class="ui-panel-content">
                    <div class="ui-form-field">
                        <label class="ui-form-label" for="showcase-default-input">Default Input</label>
                        <input type="text" id="showcase-default-input" class="ui-input" placeholder="Enter text...">
                    </div>
                    <div class="ui-form-field">
                        <label class="ui-form-label" for="showcase-value-input">With Value</label>
                        <input type="text" id="showcase-value-input" class="ui-input" value="Example value">
                    </div>
                    <div class="ui-form-field">
                        <label class="ui-form-label" for="showcase-disabled-input">Disabled</label>
                        <input
                            type="text"
                            id="showcase-disabled-input"
                            class="ui-input"
                            disabled
                            value="Disabled input"
                        >
                    </div>
                </div>
            </div>

            <!-- Dropdowns Card -->
            <div class="showcase-card">
                <h3 class="ui-heading">
                    <span class="ui-heading-text">Dropdowns</span>
                    <button class="ui-heading-toggle" aria-label="Toggle section" aria-expanded="true">
                        <svg class="ui-heading-chevron" viewBox="0 0 24 24" width="16" height="16">
                            <path d="M7 10l5 5 5-5" />
                        </svg>
                    </button>
                </h3>
                <div class="ui-panel-content">
                    <div class="ui-form-field">
                        <label class="ui-form-label" for="showcase-select">Select Option</label>
                        <select id="showcase-select" class="ui-dropdown">
                            <option>Option 1</option>
                            <option selected>Option 2</option>
                            <option>Option 3</option>
                        </select>
                    </div>
                    <div class="ui-form-field">
                        <label class="ui-form-label" for="showcase-disabled-select">Disabled</label>
                        <select id="showcase-disabled-select" class="ui-dropdown" disabled>
                            <option>Disabled Select</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Sliders Card -->
            <div class="showcase-card">
                <h3 class="ui-heading">
                    <span class="ui-heading-text">Sliders</span>
                    <button class="ui-heading-toggle" aria-label="Toggle section" aria-expanded="true">
                        <svg class="ui-heading-chevron" viewBox="0 0 24 24" width="16" height="16">
                            <path d="M7 10l5 5 5-5" />
                        </svg>
                    </button>
                </h3>
                <div class="ui-panel-content">
                    <div class="ui-form-field">
                        <label class="ui-form-label" for="showcase-default-slider">Default Slider</label>
                        <div class="ui-slider-container">
                            <input type="range" id="showcase-default-slider" class="ui-slider" value="50">
                            <span class="ui-slider-value">50</span>
                        </div>
                    </div>
                    <div class="ui-form-field">
                        <label class="ui-form-label" for="showcase-custom-slider">Custom Range (10-100)</label>
                        <div class="ui-slider-container">
                            <input
                                type="range"
                                id="showcase-custom-slider"
                                class="ui-slider"
                                min="10"
                                max="100"
                                value="75"
                            >
                            <span class="ui-slider-value">75</span>
                        </div>
                    </div>
                    <div class="ui-form-field">
                        <label class="ui-form-label" for="showcase-disabled-slider">Disabled</label>
                        <div class="ui-slider-container">
                            <input type="range" id="showcase-disabled-slider" class="ui-slider" value="30" disabled>
                            <span class="ui-slider-value">30</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Color Picker Card -->
            <div class="showcase-card">
                <h3 class="ui-heading">
                    <span class="ui-heading-text">Color Picker</span>
                    <button class="ui-heading-toggle" aria-label="Toggle section" aria-expanded="true">
                        <svg class="ui-heading-chevron" viewBox="0 0 24 24" width="16" height="16">
                            <path d="M7 10l5 5 5-5" />
                        </svg>
                    </button>
                </h3>
                <div class="ui-panel-content">
                    <div class="ui-form-field">
                        <label class="ui-form-label" for="showcase-color-picker">Choose Color</label>
                        <span class="ui-color-swatch">
                            <input type="color" id="showcase-color-picker" value="#df1b12">
                        </span>
                    </div>
                </div>
            </div>

            <!-- Feedback Card -->
            <div class="showcase-card">
                <h3 class="ui-heading">
                    <span class="ui-heading-text">Feedback</span>
                    <button class="ui-heading-toggle" aria-label="Toggle section" aria-expanded="true">
                        <svg class="ui-heading-chevron" viewBox="0 0 24 24" width="16" height="16">
                            <path d="M7 10l5 5 5-5" />
                        </svg>
                    </button>
                </h3>
                <div class="ui-panel-content">
                    <span class="ui-spinner" aria-hidden="true"></span>
                </div>
            </div>
        </div>

        <script>
        console.log('Form Controls Showcase');

        // Collapsible sections toggle
        const toggleButtons = document.querySelectorAll('.ui-heading-toggle');
        toggleButtons.forEach((button) => {
            button.addEventListener('click', () => {
                const isExpanded = button.getAttribute('aria-expanded') === 'true';
                button.setAttribute('aria-expanded', !isExpanded);
                const card = button.closest('.showcase-card');
                const content = card?.querySelector('.ui-panel-content');
                content?.classList.toggle('collapsed');
            });
        });

        // Make sliders interactive
        const sliders = document.querySelectorAll('.ui-slider:not([disabled])');
        sliders.forEach((slider) => {
            const container = slider.closest('.ui-slider-container');
            const valueDisplay = container?.querySelector('.ui-slider-value');

            if (valueDisplay) {
                slider.addEventListener('input', () => {
                    valueDisplay.textContent = slider.value;
                });
            }
        });
        </script>
    </body>
</html>
