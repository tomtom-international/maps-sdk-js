<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
        <title>Minimal Example - Maps SDK JS</title>
        <link rel="icon" href="data:,">

        <!-- Import complete SDK Example styles -->
        <link rel="stylesheet" href="../css/styles.css">
    </head>
    <body class="ui-body">
        <!-- Map container -->
        <div id="sdk-map"></div>

        <!-- Simple control panel -->
        <div class="ui-panel ui-panel-top-right ui-panel-sm">
            <h3 class="ui-heading">
                <span class="ui-heading-text">Controls</span>
                <button class="ui-heading-toggle" aria-label="Toggle panel" aria-expanded="true">
                    <svg class="ui-heading-chevron" viewBox="0 0 24 24" width="16" height="16">
                        <path d="M7 10l5 5 5-5" />
                    </svg>
                </button>
            </h3>

            <div class="ui-panel-content">
                <div class="ui-form-field">
                    <label class="ui-toggle-label">
                        <input type="checkbox" id="toggleFeature" class="ui-toggle-input" checked>
                        <span class="ui-toggle-switch"></span>
                        Enable Feature
                    </label>
                </div>

                <div class="ui-form-field">
                    <button id="actionButton" class="ui-button ui-button-full">Take Action</button>
                </div>
            </div>
        </div>

        <script type="module">
        console.log('Minimal Example - Maps SDK JS');

        const toggleButton = document.querySelector('.ui-heading-toggle');
        const panelContent = document.querySelector('.ui-panel-content');

        toggleButton?.addEventListener('click', () => {
            const isExpanded = toggleButton.getAttribute('aria-expanded') === 'true';
            toggleButton.setAttribute('aria-expanded', !isExpanded);
            panelContent?.classList.toggle('collapsed');
        });

        // Add your event listeners here
        document.querySelector('#toggleFeature')?.addEventListener('change', (e) => {
            console.log('Feature enabled:', e.target.checked);
        });

        document.querySelector('#actionButton')?.addEventListener('click', () => {
            console.log('Action button clicked');
        });
        </script>
    </body>
</html>
