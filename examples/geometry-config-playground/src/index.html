<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Geometry config playground</title>
        <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
        <link rel="icon" href="data:,">
    </head>
    <body class="sdk-example-body">
        <div id="sdk-map"></div>
        <div id="sdk-example-panel" class="sdk-example-customPanel">
            <div class="sdk-example-panel-header">
                <h3 class="sdk-example-heading">
                    <span class="sdk-example-heading-text">Geometry config</span>
                    <button class="sdk-example-heading-toggle" aria-label="Toggle panel" aria-expanded="true">
                        <svg class="sdk-example-heading-chevron" viewBox="0 0 16 10">
                            <path d="M3 1.5L8 6.5L13 1.5" />
                        </svg>
                    </button>
                </h3>
            </div>
            <div class="sdk-example-panel-content">
                <p class="sdk-example-hint">Style the fill and line independently: color and layer-stack position.</p>

                <div class="sdk-example-section">
                    <div class="sdk-example-form-field-inline">
                        <label class="sdk-example-form-label" for="sdk-example-mapStyles">Map style</label>
                        <select class="sdk-example-dropdown" id="sdk-example-mapStyles"></select>
                    </div>
                </div>

                <div class="sdk-example-section">
                    <h4 class="sdk-example-subheading">Fill</h4>
                    <div class="sdk-example-form-field-inline">
                        <label class="sdk-example-form-label" for="sdk-example-fillColor">Color</label>
                        <span class="sdk-example-color-swatch">
                            <input type="color" id="sdk-example-fillColor" value="#2A5BD7">
                        </span>
                    </div>
                    <div class="sdk-example-form-field-inline">
                        <label class="sdk-example-form-label" for="sdk-example-fillLayer">Below layer</label>
                        <select class="sdk-example-dropdown" id="sdk-example-fillLayer"></select>
                    </div>
                </div>

                <div class="sdk-example-section">
                    <h4 class="sdk-example-subheading">Line</h4>
                    <div class="sdk-example-form-field-inline">
                        <label class="sdk-example-form-label" for="sdk-example-lineColor">Color</label>
                        <span class="sdk-example-color-swatch">
                            <input type="color" id="sdk-example-lineColor" value="#1B3A8C">
                        </span>
                    </div>
                    <div class="sdk-example-form-field-inline">
                        <label class="sdk-example-form-label" for="sdk-example-lineLayer">Below layer</label>
                        <select class="sdk-example-dropdown" id="sdk-example-lineLayer"></select>
                    </div>
                </div>
            </div>
        </div>
        <script type="module" src="./index.ts"></script>
    </body>
</html>
