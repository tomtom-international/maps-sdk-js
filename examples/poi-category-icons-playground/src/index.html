<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>POI Category Icons Playground</title>
        <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
        <link rel="icon" href="data:,">
    </head>
    <body class="ui-body">
        <div id="sdk-map"></div>
        <div class="ui-customPanel">
            <div class="ui-panel-header">
                <h3 class="ui-heading">
                    <span class="ui-heading-text">Icons per POI category</span>
                    <button class="ui-heading-toggle" aria-label="Toggle panel" aria-expanded="true">
                        <svg class="ui-heading-chevron" viewBox="0 0 16 10">
                            <path d="M3 1.5L8 6.5L13 1.5" />
                        </svg>
                    </button>
                </h3>
            </div>
            <div class="ui-panel-content">
                <div class="ui-section">
                    <span class="ui-form-label">Show</span>
                    <label class="ui-toggle-label">
                        <input type="checkbox" id="map-pois-toggle" class="ui-toggle-input" checked>
                        <span class="ui-toggle-switch"></span>
                        The map's own POIs
                    </label>
                    <label class="ui-toggle-label">
                        <input type="checkbox" id="search-results-toggle" class="ui-toggle-input" checked>
                        <span class="ui-toggle-switch"></span>
                        Places found by a search
                    </label>
                </div>
                <div class="ui-section">
                    <span class="ui-form-label">Icon per category</span>
                    <div id="category-rows"></div>
                </div>
            </div>
        </div>
        <script type="module" src="./index.ts"></script>
    </body>
</html>
