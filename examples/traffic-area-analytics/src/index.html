<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Area Analytics Explorer</title>
        <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
        <link rel="icon" href="data:,">
    </head>
    <body class="sdk-example-body">
        <div id="sdk-map"></div>

        <!-- Controls panel (top-right) -->
        <div class="sdk-example-customPanel">
            <div class="sdk-example-panel-header">
                <h3 class="sdk-example-heading">
                    <span class="sdk-example-heading-text">Traffic Area Analytics</span>
                </h3>
            </div>
            <div class="sdk-example-panel-content">
                <div class="sdk-example-section">
                    <label class="sdk-example-form-label" for="city-input">City</label>
                    <div class="aa-search-wrapper">
                        <input
                            type="text"
                            class="sdk-example-input"
                            id="city-input"
                            placeholder="Search for a city..."
                            autocomplete="off"
                        >
                        <ul id="city-suggestions" class="aa-suggestions" role="listbox"></ul>
                    </div>
                </div>
                <div class="sdk-example-section">
                    <label class="sdk-example-form-label">Metric</label>
                    <div class="aa-radio-group" id="metric-selector" role="radiogroup">
                        <label class="aa-radio-option aa-radio-active">
                            <input type="radio" name="metric" value="congestionLevel" checked>
                            Congestion
                        </label>
                        <label class="aa-radio-option">
                            <input type="radio" name="metric" value="speed">
                            Speed
                        </label>
                        <label class="aa-radio-option">
                            <input type="radio" name="metric" value="travelTime">
                            Travel Time
                        </label>
                    </div>
                </div>
                <div class="sdk-example-section">
                    <label class="sdk-example-form-label">Visualization</label>
                    <div class="aa-radio-group" id="mode-selector" role="radiogroup">
                        <label class="aa-radio-option aa-radio-active">
                            <input type="radio" name="mode" value="hexgrid" checked>
                            Hex Grid
                        </label>
                        <label class="aa-radio-option">
                            <input type="radio" name="mode" value="heatmap">
                            Heatmap
                        </label>
                    </div>
                </div>
                <div class="sdk-example-section">
                    <label class="sdk-example-form-label">Color Scheme</label>
                    <div class="aa-radio-group" id="color-scheme-selector" role="radiogroup">
                        <label class="aa-radio-option aa-radio-active">
                            <input type="radio" name="colorScheme" value="congestion" checked>
                            Congestion
                        </label>
                        <label class="aa-radio-option">
                            <input type="radio" name="colorScheme" value="thermal">
                            Thermal
                        </label>
                        <label class="aa-radio-option">
                            <input type="radio" name="colorScheme" value="monochrome">
                            Mono
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <!-- Stats + heatmap panel (bottom-right) -->
        <div id="bottom-panel" class="aa-bottom-panel aa-hidden">
            <div class="aa-bottom-header">
                <span id="panel-city-name" class="aa-city-name"></span>
                <div class="aa-stats">
                    <div class="aa-stat-chip">
                        <span class="aa-stat-label">Avg Congestion</span>
                        <span id="stat-congestion" class="aa-stat-value">--</span>
                    </div>
                    <div class="aa-stat-chip">
                        <span class="aa-stat-label">Avg Speed</span>
                        <span id="stat-speed" class="aa-stat-value">--</span>
                    </div>
                    <div class="aa-stat-chip">
                        <span class="aa-stat-label">Avg Travel Time</span>
                        <span id="stat-traveltime" class="aa-stat-value">--</span>
                    </div>
                    <div class="aa-stat-chip">
                        <span class="aa-stat-label">Free Flow</span>
                        <span id="stat-freeflow" class="aa-stat-value">--</span>
                    </div>
                </div>
            </div>
            <div class="aa-heatmap-section">
                <label class="sdk-example-form-label">Congestion by Day &amp; Hour (last 7 days)</label>
                <canvas id="heatmap-canvas"></canvas>
            </div>
        </div>

        <!-- Floating legend -->
        <div class="aa-floating-legend">
            <label class="aa-legend-title" id="legend-title">Congestion Level</label>
            <div class="aa-legend-bar" id="legend-bar"></div>
            <div class="aa-legend-labels">
                <span id="legend-min">Free</span>
                <span id="legend-max">Standstill</span>
            </div>
        </div>

        <!-- Loading overlay -->
        <div id="loading-overlay" class="aa-loading aa-hidden">
            <div class="aa-spinner"></div>
            <span>Loading analytics...</span>
        </div>

        <!-- Tooltip -->
        <div id="tile-tooltip" class="aa-tooltip aa-hidden"></div>

        <script type="module" src="./index.ts"></script>
    </body>
</html>
