<!doctype html>
<html lang="en">
    <head>
        <title>Traffic Incidents Playground</title>
        <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
        <link rel="icon" href="data:,">
    </head>
    <body class="ui-body">
        <div id="sdk-map"></div>
        <div class="ui-customPanel">
            <div class="ui-panel-header">
                <h3 class="ui-heading">
                    <span class="ui-heading-text">Traffic Incidents</span>
                    <button class="ui-heading-toggle" aria-label="Toggle panel" aria-expanded="true">
                        <svg class="ui-heading-chevron" viewBox="0 0 16 10">
                            <path d="M3 1.5L8 6.5L13 1.5" />
                        </svg>
                    </button>
                </h3>
            </div>

            <div class="ui-panel-content">
                <div class="ui-section">
                    <h4 class="ui-subheading">Magnitude Filter</h4>
                    <label class="ui-toggle-label">
                        <input type="checkbox" class="ui-toggle-input" name="magnitude" value="unknown" checked>
                        <span class="ui-toggle-switch"></span>
                        Unknown
                    </label>
                    <label class="ui-toggle-label">
                        <input type="checkbox" class="ui-toggle-input" name="magnitude" value="minor" checked>
                        <span class="ui-toggle-switch"></span>
                        Minor
                    </label>
                    <label class="ui-toggle-label">
                        <input type="checkbox" class="ui-toggle-input" name="magnitude" value="moderate" checked>
                        <span class="ui-toggle-switch"></span>
                        Moderate
                    </label>
                    <label class="ui-toggle-label">
                        <input type="checkbox" class="ui-toggle-input" name="magnitude" value="major" checked>
                        <span class="ui-toggle-switch"></span>
                        Major
                    </label>
                    <label class="ui-toggle-label">
                        <input type="checkbox" class="ui-toggle-input" name="magnitude" value="indefinite" checked>
                        <span class="ui-toggle-switch"></span>
                        Indefinite
                    </label>
                </div>

                <div class="ui-section">
                    <button class="ui-button ui-button-full" id="ui-clearFilter">Show All</button>
                </div>
            </div>
        </div>
        <script type="module" src="./index.ts"></script>
    </body>
</html>
